name: Renian checks

on:
  push:
    branches:
      - main
      - "fix/**"
      - "chore/**"
      - "feat/**"
  pull_request:
    branches:
      - main

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: |
          node --check cloudfunctions/renianApi/index.js
          node --check services/cloud.js
          node --check pages/index/index.js
          node --check pages/permissions/permissions.js
          node --check pages/privileges/privileges.js
          node --check tests/renian-api/mock-wx-server-sdk.js
          node --check tests/renian-api/race.test.js
      - name: renianApi regression tests
        run: node tests/renian-api/race.test.js

  powershell-parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $files = @(
            'setup-local.ps1',
            'update-main.ps1',
            'database-preflight.ps1',
            'database-migrate.ps1',
            'scripts/database-common.ps1'
          )

          foreach ($file in $files) {
            if (-not (Test-Path $file)) {
              throw "Missing PowerShell script: $file"
            }

            $tokens = $null
            $errors = $null
            $ast = [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            )

            if ($errors.Count -gt 0) {
              Write-Host "PowerShell parse errors in $file" -ForegroundColor Red
              $errors | ForEach-Object { Write-Host $_.Message -ForegroundColor Red }
              exit 1
            }

            $reserved = @(
              'Args', 'Input', 'This', 'Matches', 'Error', 'Home',
              'PID', 'PSHome', 'Host', 'Profile', 'PWD', 'Null',
              'True', 'False', 'ForEach', 'Switch'
            )
            $params = $ast.FindAll({
              param($node)
              $node -is [System.Management.Automation.Language.ParameterAst]
            }, $true)

            foreach ($paramAst in $params) {
              $name = $paramAst.Name.VariablePath.UserPath
              if ($reserved -contains $name) {
                throw "PowerShell parameter '$name' in $file shadows an automatic variable."
              }
            }
          }

          Write-Host "All PowerShell scripts parsed successfully and avoid reserved automatic-variable parameters."

      - name: Updater smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceUpdater = (Resolve-Path 'update-main.ps1').Path
          $root = Join-Path $env:RUNNER_TEMP 'renian-updater-smoke'
          $remote = Join-Path $root 'remote.git'
          $work = Join-Path $root 'work'

          Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $root | Out-Null

          git init --bare $remote | Out-Null
          git clone $remote $work | Out-Null
          Set-Location $work
          git config user.email 'ci@example.invalid'
          git config user.name 'Renian CI'

          Copy-Item $sourceUpdater (Join-Path $work 'update-main.ps1')
          Set-Content -Path 'marker.txt' -Value 'v1'
          git add update-main.ps1 marker.txt
          git commit -m 'initial' | Out-Null
          git branch -M main
          git push -u origin main | Out-Null

          Set-Content -Path 'marker.txt' -Value 'v2'
          git add marker.txt
          git commit -m 'remote update' | Out-Null
          git push origin main | Out-Null
          $remoteHead = (git rev-parse HEAD).Trim()

          git reset --hard HEAD~1 | Out-Null
          Set-Content -Path 'marker.txt' -Value 'local change'

          & powershell -NoProfile -ExecutionPolicy Bypass -File .\update-main.ps1 -Force
          if ($LASTEXITCODE -ne 0) {
            throw "update-main.ps1 smoke test failed with exit code $LASTEXITCODE"
          }

          $localHead = (git rev-parse HEAD).Trim()
          if ($localHead -ne $remoteHead) {
            throw "Updater did not reset local main to origin/main."
          }

          if ((Get-Content 'marker.txt' -Raw).Trim() -ne 'v2') {
            throw "Updater did not restore the remote file contents."
          }

          Write-Host 'update-main.ps1 force-update smoke test passed.'


      - name: Windows PowerShell 5.1 preflight compatibility
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\powershell\preflight-compat.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "Windows PowerShell 5.1 preflight compatibility test failed with exit code $LASTEXITCODE"
          }

      - name: Windows PowerShell 5.1 native JSON argv
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\powershell\native-json-argv.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "Windows PowerShell 5.1 native JSON argv test failed with exit code $LASTEXITCODE"
          }
